name: Portfolio CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  issues: write   # 👈 This is the critical fix

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Save test results
        if: failure()
        run: |
          echo "Pipeline failed. See logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > issue.md

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Test Failure - Portfolio CI Pipeline"
          content-filepath: ./issue.md
